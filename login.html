<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #333;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #5b86e5 0%, #36d1dc 100%);
    }
    .login-card {
      width: min(420px, 90vw);
      padding: 32px;
      border-radius: 18px;
      background: #ffffffee;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
      text-align: center;
    }
    .login-card h1 {
      margin: 0 0 16px;
      font-size: 1.9rem;
      color: #1a1a1a;
    }
    .login-card p {
      margin: 0 0 28px;
      color: #555;
      line-height: 1.6;
    }
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccd6e0;
      border-radius: 12px;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: #5b86e5;
      box-shadow: 0 0 0 4px rgba(91, 134, 229, 0.12);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
    }
    .actions button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #5b86e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .actions button:hover {
      background: #4a73d1;
      transform: translateY(-1px);
    }
    .secondary {
      background: #f4f7fb;
      color: #333;
    }
    .secondary:hover {
      background: #e7ecf5;
    }
    .error-message {
      color: #d64545;
      margin: 8px 0 0;
      font-size: 0.95rem;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.92rem;
      color: #666;
    }
    .footer a {
      color: #5b86e5;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Welcome Back</h1>
    <p>Sign in to your account to continue to the dashboard.</p>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required minlength="6" />
      </div>
      <div class="actions">
        <button type="submit">Log In</button>
        <button type="button" class="secondary" onclick="location.href='index.html'">Back to Home</button>
      </div>
      <p id="errorMessage" class="error-message" aria-live="polite" hidden></p>
    </form>
    <div class="footer">
      Don’t have an account? <a href="contact-us.html">Contact us</a>
    </div>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      errorMessage.hidden = true;
      errorMessage.textContent = '';

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      if (!email.includes('@')) {
        showError('Please enter a valid email address.');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      alert('Login submitted!');
      form.reset();
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.hidden = false;
    }
  </script>
</body>
</html>
